name: Dependency review

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "qa/**"

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-26.04
    # The retry below waits for the workflow_run submit, which cannot start
    # until Dependencies has finished.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      # No checkout and no pull-requests: write. The summary stays in the job log.
      # High and critical runtime advisories fail this job. Moderate, low, and
      # non-runtime scopes do not. The staging build does not wait on this job.
      - name: Review dependencies
        id: review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          comment-summary-in-pr: never
          show-openssf-scorecard: false
          license-check: false
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 1200

      # The action proceeds after the retry even when the head SHA still has
      # no snapshot, and a skipped submission would then pass. Fail closed.
      - name: Fail when the head snapshot is missing
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          gh api --include \
            "/repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}?per_page=1" \
            > "$response"
          b64="$(awk 'BEGIN{IGNORECASE=1} /^x-github-dependency-graph-snapshot-warnings:/ {sub(/^[^:]*:[[:space:]]*/, ""); print; exit}' "$response" | tr -d '\r')"
          if [ -z "$b64" ]; then
            echo "No snapshot warnings. Head ${HEAD_SHA} has a dependency snapshot."
            exit 0
          fi
          warnings="$(printf '%s' "$b64" | base64 --decode)"
          printf '%s\n' "$warnings"
          if printf '%s' "$warnings" | grep -F -q 'No snapshots were found for the head SHA'; then
            echo "::error::No dependency snapshot for ${HEAD_SHA}. A missing submission must fail this job rather than pass with nothing to compare."
            exit 1
          fi
