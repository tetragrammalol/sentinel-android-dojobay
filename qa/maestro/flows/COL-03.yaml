# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: COL-03
tags:
- p0
- collection
properties:
  plan: 'COL-03: Add a key via Home NEW -> choose the collection: edit shows the existing keys plus the new one'
  expect: pass
---
- runFlow: ../subflows/ensure_test_collection.yaml
- runFlow:
    file: ../subflows/paste_pubkey.yaml
    env: { KEY: "${VPUB_C}" }
- waitForAnimationToEnd: { timeout: 5000 }
- extendedWaitUntil: { visible: { id: "createNewCollection" }, timeout: 30000 }
- tapOn: { text: "MaestroT", below: { id: "createNewCollection" } }
- runFlow:
    when: { visible: { id: "bottomSheetInputField" } }
    commands:
      - tapOn: { id: "bottomSheetInputField" }
      - eraseText: 30
      - inputText: "KeyC"
      - tapOn: { id: "bottomSheetConfirmPositiveBtn" }
- extendedWaitUntil: { visible: { id: "collectionEdiText" }, timeout: 30000 }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: COL-03-edit, optional: true } } ] }
- assertVisible: { id: "pubKeyItemLabel", text: "KeyA", label: "Existing key still listed" }
- assertVisible: { id: "pubKeyItemLabel", text: "KeyC" }
- tapOn: { id: "saveCollectionMenuItem" }
- waitForAnimationToEnd: { timeout: 5000 }
- runFlow: ../subflows/home_basic.yaml
