appId: ${APP_ID}
name: COL-04
tags:
- p0
- collection
- known-fixed
properties:
  plan: 'COL-04: Duplicate key via Home -> choose collection: "already exists", keys kept, no empty edit (fixed #243)'
  expect: pass
---
- runFlow: ../subflows/ensure_test_collection.yaml
- runFlow:
    file: ../subflows/paste_pubkey.yaml
    env: { KEY: "${VPUB_A}" }
- waitForAnimationToEnd: { timeout: 5000 }
- extendedWaitUntil: { visible: { id: "createNewCollection" }, timeout: 30000 }
- tapOn: { text: "MaestroT", below: { id: "createNewCollection" } }
- runFlow:
    when: { visible: { id: "bottomSheetInputField" } }
    commands:
      - tapOn: { id: "bottomSheetConfirmPositiveBtn" }
- waitForAnimationToEnd: { timeout: 5000 }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: COL-04-after, optional: true } } ] }
- runFlow:
    when: { visible: { id: "collectionEdiText" } }
    commands:
      - assertVisible: { id: "pubKeyItemLabel", text: "KeyA", label: "If edit opens, the existing key is listed (not an empty edit)" }
      - back
- runFlow: ../subflows/home_basic.yaml
- tapOn: { id: "rvItemCollectionTitle", text: "MaestroT" }
- extendedWaitUntil: { visible: { text: "KeyA" }, timeout: 30000 }
- back
