# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: PIN-04
tags:
- smoke
- p0
- pin
- lock
properties:
  plan: 'PIN-04: Unlock with the right PIN'
  expect: pass
---
- runFlow: ../subflows/home_basic.yaml
- runFlow: ../subflows/lock.yaml
- assertVisible:
    id: "lockScreenText"
    text: "Enter pin code"
- assertNotVisible:
    id: "fab"
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: PIN-04-lock, optional: true } } ] }
- runFlow: ../subflows/unlock.yaml
- extendedWaitUntil:
    visible:
      id: "fab"
    timeout: 90000
- assertVisible:
    id: "rvItemCollectionTitle"
    text: "My Wallet"
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: PIN-04-home, optional: true } } ] }