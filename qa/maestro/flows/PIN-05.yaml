# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: PIN-05
tags:
- smoke
- p0
- pin
- lock
properties:
  plan: 'PIN-05: Wrong PIN is rejected, field cleared, retry works'
  expect: pass
---
- evalScript:
    script: "${output.wrong = (String(MAESTRO_SENTINEL_PIN).indexOf('13579') === 0) ? '24680' : '13579'}"
    label: "Pick a 5-digit wrong PIN (never the real one)"
- runFlow: ../subflows/lock.yaml
- evalScript:
    script: ${output.k = 0}
    label: "reset key index"
- repeat:
    times: 5
    commands:
      - tapOn:
          id: "t[a-j]"
          text: ${String(output.wrong).charAt(output.k)}
          label: "Wrong PIN key"
      - evalScript:
          script: ${output.k = output.k + 1}
          label: "next key"
- tapOn: { id: "tconfirm", label: "Confirm wrong PIN" }
- waitForAnimationToEnd: { timeout: 5000 }
- assertVisible: { id: "lockScreenText" }
- assertNotVisible:
    id: "tconfirm"
    label: "Field cleared after the wrong PIN"
- assertNotVisible: { id: "fab" }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: PIN-05-after-wrong, optional: true } } ] }
- runFlow: ../subflows/unlock.yaml
- assertVisible: { id: "fab" }
