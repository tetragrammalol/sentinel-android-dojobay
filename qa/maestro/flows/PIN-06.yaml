# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: PIN-06
tags:
- p1
- pin
- lock
- slow
properties:
  plan: 'PIN-06: 20 wrong PINs: no crash, no lockout (behaviour noted for the maintainers)'
  expect: pass
  known: 'No attempt limit in code: passing means 20 wrong PINs were accepted without lockout or wipe (flag to the maintainers)'
---
- evalScript:
    script: "${output.wrong = (String(MAESTRO_SENTINEL_PIN).indexOf('13579') === 0) ? '24680' : '13579'}"
    label: "Pick a 5-digit wrong PIN (never the real one)"
- runFlow: ../subflows/lock.yaml
- repeat:
    times: 20
    commands:
      - evalScript:
          script: ${output.k = 0}
          label: "reset key index"
      - repeat:
          times: 5
          commands:
            - tapOn:
                id: "t[a-j]"
                text: ${String(output.wrong).charAt(output.k)}
                label: "Wrong PIN key"
            - evalScript:
                script: ${output.k = output.k + 1}
                label: "next key"
      - tapOn: { id: "tconfirm", label: "Confirm wrong PIN" }
      - assertVisible: { id: "lockScreenText" }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: PIN-06-after-20-wrong, optional: true } } ] }
- runFlow: ../subflows/unlock.yaml
- assertVisible:
    id: "fab"
    label: "Right PIN still works after 20 wrong ones (no lockout exists)"
