# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: PIN-10
tags:
- p2
- pin
- lock
- settings
properties:
  plan: 'PIN-10: Scramble off gives the sequential keypad; turned back on after'
  expect: pass
---
- runFlow: ../subflows/open_settings.yaml
- assertVisible: { text: "Scramble PIN entry" }
- tapOn: { text: "Scramble PIN entry" }
- runFlow: ../subflows/home_basic.yaml
- runFlow: ../subflows/lock.yaml
- evalScript: { script: "${output.l = ''}", label: "init" }
- copyTextFrom:
    id: "ta"
    label: "Read key ta"
- evalScript:
    script: ${output.l = (output.l || '') + maestro.copiedText}
    label: "Append key ta"
- copyTextFrom:
    id: "tb"
    label: "Read key tb"
- evalScript:
    script: ${output.l = (output.l || '') + maestro.copiedText}
    label: "Append key tb"
- copyTextFrom:
    id: "tc"
    label: "Read key tc"
- evalScript:
    script: ${output.l = (output.l || '') + maestro.copiedText}
    label: "Append key tc"
- copyTextFrom:
    id: "td"
    label: "Read key td"
- evalScript:
    script: ${output.l = (output.l || '') + maestro.copiedText}
    label: "Append key td"
- copyTextFrom:
    id: "te"
    label: "Read key te"
- evalScript:
    script: ${output.l = (output.l || '') + maestro.copiedText}
    label: "Append key te"
- copyTextFrom:
    id: "tf"
    label: "Read key tf"
- evalScript:
    script: ${output.l = (output.l || '') + maestro.copiedText}
    label: "Append key tf"
- copyTextFrom:
    id: "tg"
    label: "Read key tg"
- evalScript:
    script: ${output.l = (output.l || '') + maestro.copiedText}
    label: "Append key tg"
- copyTextFrom:
    id: "th"
    label: "Read key th"
- evalScript:
    script: ${output.l = (output.l || '') + maestro.copiedText}
    label: "Append key th"
- copyTextFrom:
    id: "ti"
    label: "Read key ti"
- evalScript:
    script: ${output.l = (output.l || '') + maestro.copiedText}
    label: "Append key ti"
- copyTextFrom:
    id: "tj"
    label: "Read key tj"
- evalScript:
    script: ${output.l = (output.l || '') + maestro.copiedText}
    label: "Append key tj"
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: PIN-10-sequential, optional: true } } ] }
- runFlow: ../subflows/unlock.yaml
# restore Scramble ON before asserting, so a failure never leaves it off
- runFlow: ../subflows/open_settings.yaml
- tapOn: { text: "Scramble PIN entry" }
- runFlow: ../subflows/home_basic.yaml
- assertTrue:
    condition: ${output.l === '1234567890'}
    label: "Scramble off: keys ta..tj read 1,2,...,9,0"
