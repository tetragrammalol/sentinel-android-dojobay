# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: PIN-17
tags:
- p0
- settings
- security
- known
properties:
  plan: 'PIN-17: Backup export asks for the PIN first (known N4: it does not)'
  expect: fail
  known: 'Known N4 (P0 per plan): export and erase are not PIN-gated. Erase is never tapped by this suite'
---
- runFlow: ../subflows/open_settings.yaml
- scrollUntilVisible:
    element: { text: "Export Sentinel Backup" }
    direction: DOWN
    timeout: 30000
- tapOn: "Export Sentinel Backup"
- waitForAnimationToEnd: { timeout: 3000 }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: PIN-17-after-export-tap, optional: true } } ] }
- assertVisible: { id: "lockScreenText", label: "PIN prompt before export" }
