# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: PSBT-03
tags:
- p2
- psbt
properties:
  plan: 'PSBT-03: Share menu lists the 4 export options; Share as text does not crash'
  expect: pass
  known: ATD has no share targets; this checks the menu and that the share intent does not crash the app
---
- runFlow:
    file: ../subflows/open_collection.yaml
    env: { COLLECTION: "My Wallet" }
- tapOn: { id: "bottom_nav_send" }
- extendedWaitUntil: { visible: { id: "composeBtn" }, timeout: 30000 }
- extendedWaitUntil:
    visible: { id: "totalBTC", text: "[0-9.]+ BTC" }
    timeout: 60000
- runScript: { file: ../scripts/js/clip_set.js, env: { TEXT: "${TB1_ADDR}" }, label: "clipboard = throwaway tb1 address" }
- tapOn: { id: "text_input_end_icon", index: 0, label: "Paste icon in the To field" }
- assertVisible: { id: "btcAddress", text: "${TB1_ADDR}" }
- tapOn: { id: "btcEditText" }
- eraseText: 20
- inputText: "0.001"
- extendedWaitUntil:
    visible: { id: "composeBtn", enabled: true }
    timeout: 60000
    label: "COMPOSE becomes enabled (fee estimate can take a while on the emulator)"
- tapOn: { id: "composeBtn" }
- extendedWaitUntil:
    visible: { id: "psbtQRCode|psbtCopyBtn|unsignedTxView" }
    timeout: 60000
- assertVisible: { id: "broadCastTransactionBtn", label: "Unsigned Transaction screen (BROADCAST is never tapped)" }
- tapOn: { id: "psbtShareBtn" }
- waitForAnimationToEnd: { timeout: 3000 }
- assertVisible: "Share as text"
- assertVisible: "Save as text file"
- assertVisible: "Share as psbt"
- assertVisible: "Save as psbt file"
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: PSBT-03-menu, optional: true } } ] }
- tapOn: "Share as text"
- waitForAnimationToEnd: { timeout: 5000 }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: PSBT-03-share, optional: true } } ] }
- back
- runFlow: ../subflows/home_basic.yaml
