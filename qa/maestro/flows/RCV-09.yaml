# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: RCV-09
tags:
- p0
- receive
- stress
properties:
  plan: 'RCV-09: Tab <-> Receive <-> key tab 10 times: no crash or loop'
  expect: pass
  known: Plan says 20 cycles; 10 here to save time on the slow emulator (manual run did 20)
---
- runFlow:
    file: ../subflows/open_collection.yaml
    env: { COLLECTION: "My Wallet" }
- repeat:
    times: 10
    commands:
      - tapOn: { id: "bottom_nav_transaction" }
      - tapOn: "Deposit"
      - tapOn: { id: "bottom_nav_receive" }
      - assertVisible: { id: "receiveAddressText" }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: RCV-09-after-loop, optional: true } } ] }
- back
