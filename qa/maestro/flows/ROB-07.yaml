# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: ROB-07
tags:
- smoke
- p1
- rotation
- robustness
properties:
  plan: 'ROB-07: Rotate on Home, collection, Receive, Send, Settings, Tools: no crash'
  expect: pass
---
- runFlow: ../subflows/home.yaml
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd: { timeout: 5000 }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: ROB-07-home, optional: true } } ] }
- assertVisible: { id: "toolbarIcon" }
- setOrientation: PORTRAIT
- runFlow:
    file: ../subflows/open_collection.yaml
    env: { COLLECTION: "My Wallet" }
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd: { timeout: 5000 }
- assertVisible: { id: "collection_details_transaction_edit_option" }
- setOrientation: PORTRAIT
- tapOn: { id: "bottom_nav_receive" }
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd: { timeout: 5000 }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: ROB-07-receive, optional: true } } ] }
- assertVisible: { id: "receiveAddressText" }
- setOrientation: PORTRAIT
- tapOn: { id: "bottom_nav_send" }
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd: { timeout: 5000 }
- assertVisible: { id: "composeBtn" }
- setOrientation: PORTRAIT
- runFlow: ../subflows/open_settings.yaml
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd: { timeout: 5000 }
- assertVisible: "User PIN code"
- setOrientation: PORTRAIT
- runFlow: ../subflows/open_tools.yaml
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd: { timeout: 5000 }
- assertVisible: "Broadcast Signed Transaction"
- setOrientation: PORTRAIT
- runFlow: ../subflows/home_basic.yaml
