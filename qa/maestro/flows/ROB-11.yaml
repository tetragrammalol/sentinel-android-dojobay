# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: ROB-11
tags:
- p1
- send
- robustness
properties:
  plan: 'ROB-11: Double-tap COMPOSE opens one Unsigned Transaction screen'
  expect: pass
  known: Only COMPOSE is double-tapped (BROADCAST is never tapped by this suite)
---
- runFlow:
    file: ../subflows/open_collection.yaml
    env: { COLLECTION: "My Wallet" }
- tapOn: { id: "bottom_nav_send" }
- extendedWaitUntil: { visible: { id: "composeBtn" }, timeout: 30000 }
- extendedWaitUntil:
    visible: { id: "totalBTC", text: "[0-9.]+ BTC" }
    timeout: 60000
- runScript: { file: ../scripts/js/clip_set.js, env: { TEXT: "${TB1_ADDR}" }, label: "clipboard = throwaway tb1 address" }
- tapOn: { id: "text_input_end_icon", index: 0, label: "Paste icon in the To field" }
- assertVisible: { id: "btcAddress", text: "${TB1_ADDR}" }
- tapOn: { id: "btcEditText" }
- eraseText: 20
- inputText: "0.001"
- doubleTapOn: { id: "composeBtn" }
- extendedWaitUntil: { visible: { id: "broadCastTransactionBtn" }, timeout: 60000 }
- back
- waitForAnimationToEnd: { timeout: 3000 }
- assertVisible: { id: "composeBtn", label: "One Back returns to the form: only one PSBT screen was opened" }
- assertNotVisible: { id: "broadCastTransactionBtn" }
- back
