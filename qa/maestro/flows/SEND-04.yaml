# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: SEND-04
tags:
- smoke
- p0
- send
properties:
  plan: 'SEND-04: Invalid addresses keep COMPOSE disabled (garbage, mainnet, bad checksum); valid control enables it'
  expect: pass
  known: 'N6: no "Invalid address" text is shown, only the disabled button'
---
- runFlow:
    file: ../subflows/open_collection.yaml
    env: { COLLECTION: "My Wallet" }
- tapOn: { id: "bottom_nav_send" }
- extendedWaitUntil: { visible: { id: "composeBtn" }, timeout: 30000 }
- extendedWaitUntil:
    visible: { id: "totalBTC", text: "[0-9.]+ BTC" }
    timeout: 60000
- tapOn: { id: "btcEditText" }
- eraseText: 20
- inputText: "0.001"
- tapOn: { id: "btcAddress" }
- eraseText: 80
- inputText: "${GARBAGE}"
- waitForAnimationToEnd: { timeout: 3000 }
- extendedWaitUntil: { visible: { id: "composeBtn", enabled: true }, timeout: 10000, optional: true, label: "give COMPOSE 10 s to (wrongly) enable" }
- assertVisible:
    id: "composeBtn"
    enabled: false
    label: "COMPOSE disabled: garbage"
- tapOn: { id: "btcAddress" }
- eraseText: 80
- inputText: "${MAIN_ADDR}"
- waitForAnimationToEnd: { timeout: 3000 }
- extendedWaitUntil: { visible: { id: "composeBtn", enabled: true }, timeout: 10000, optional: true, label: "give COMPOSE 10 s to (wrongly) enable" }
- assertVisible:
    id: "composeBtn"
    enabled: false
    label: "COMPOSE disabled: mainnet address on testnet"
- tapOn: { id: "btcAddress" }
- eraseText: 80
- inputText: "${TB1_BADSUM}"
- waitForAnimationToEnd: { timeout: 3000 }
- extendedWaitUntil: { visible: { id: "composeBtn", enabled: true }, timeout: 10000, optional: true, label: "give COMPOSE 10 s to (wrongly) enable" }
- assertVisible:
    id: "composeBtn"
    enabled: false
    label: "COMPOSE disabled: bad checksum"
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: SEND-04-badsum, optional: true } } ] }
- tapOn: { id: "btcAddress" }
- eraseText: 80
- inputText: "${TB1_ADDR}"
- waitForAnimationToEnd: { timeout: 3000 }
- extendedWaitUntil: { visible: { id: "composeBtn", enabled: true }, timeout: 60000, label: "control: valid tb1 address enables COMPOSE" }
- back
