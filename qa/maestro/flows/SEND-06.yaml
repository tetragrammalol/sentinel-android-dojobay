# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: SEND-06
tags:
- p1
- send
properties:
  plan: 'SEND-06: Zero, empty and 9-decimal amounts are blocked or limited to 8 decimals'
  expect: pass
---
- runFlow:
    file: ../subflows/open_collection.yaml
    env: { COLLECTION: "My Wallet" }
- tapOn: { id: "bottom_nav_send" }
- extendedWaitUntil: { visible: { id: "composeBtn" }, timeout: 30000 }
- extendedWaitUntil:
    visible: { id: "totalBTC", text: "[0-9.]+ BTC" }
    timeout: 60000
- runScript: { file: ../scripts/js/clip_set.js, env: { TEXT: "${TB1_ADDR}" }, label: "clipboard = throwaway tb1 address" }
- tapOn: { id: "text_input_end_icon", index: 0, label: "Paste icon in the To field" }
- assertVisible: { id: "btcAddress", text: "${TB1_ADDR}" }
- tapOn: { id: "btcEditText" }
- eraseText: 20
- inputText: "0"
- waitForAnimationToEnd: { timeout: 3000 }
- extendedWaitUntil: { visible: { id: "composeBtn", enabled: true }, timeout: 10000, optional: true, label: "give COMPOSE 10 s to (wrongly) enable" }
- assertVisible:
    id: "composeBtn"
    enabled: false
    label: "COMPOSE disabled: amount 0"
- tapOn: { id: "btcEditText" }
- eraseText: 20
- waitForAnimationToEnd: { timeout: 3000 }
- extendedWaitUntil: { visible: { id: "composeBtn", enabled: true }, timeout: 10000, optional: true, label: "give COMPOSE 10 s to (wrongly) enable" }
- assertVisible:
    id: "composeBtn"
    enabled: false
    label: "COMPOSE disabled: empty amount"
- tapOn: { id: "btcEditText" }
- eraseText: 20
- inputText: "0.123456789"
- waitForAnimationToEnd: { timeout: 2000 }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: SEND-06-9-decimals, optional: true } } ] }
- assertNotVisible: { id: "btcEditText", text: "0\\.123456789", label: "No 9th decimal accepted" }
- back
