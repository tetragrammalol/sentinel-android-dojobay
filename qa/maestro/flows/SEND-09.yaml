# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: SEND-09
tags:
- p2
- send
properties:
  plan: 'SEND-09: BTC and fiat fields convert into each other'
  expect: pass
---
- runFlow:
    file: ../subflows/open_collection.yaml
    env: { COLLECTION: "My Wallet" }
- tapOn: { id: "bottom_nav_send" }
- extendedWaitUntil: { visible: { id: "composeBtn" }, timeout: 30000 }
- extendedWaitUntil:
    visible: { id: "totalBTC", text: "[0-9.]+ BTC" }
    timeout: 60000
- tapOn: { id: "fiatEditText" }
- eraseText: 20
- inputText: "10"
- waitForAnimationToEnd: { timeout: 3000 }
- copyTextFrom: { id: "btcEditText" }
- evalScript: { script: "${output.b = parseFloat(maestro.copiedText.replace(/[^0-9.]/g,''))}", label: "btc from fiat" }
- assertTrue: { condition: "${output.b > 0 && output.b < 1}", label: "10 fiat -> a small BTC amount" }
- tapOn: { id: "btcEditText" }
- eraseText: 20
- inputText: "0.001"
- waitForAnimationToEnd: { timeout: 3000 }
- copyTextFrom: { id: "fiatEditText" }
- evalScript: { script: "${output.f = parseFloat(maestro.copiedText.replace(/[^0-9.]/g,''))}", label: "fiat from btc" }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: SEND-09, optional: true } } ] }
- assertTrue: { condition: "${output.f > 0}", label: "0.001 BTC -> non-zero fiat" }
- assertTrue: { condition: "${Math.abs((output.f/0.001) - (10/output.b)) / (10/output.b) < 0.02}", label: "Both directions use the same rate (2%)" }
- back
