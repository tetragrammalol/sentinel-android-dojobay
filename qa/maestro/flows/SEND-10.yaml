# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: SEND-10
tags:
- p1
- send
- fee
properties:
  plan: 'SEND-10: Fee priority: Low at the left end, higher label/rate at the right end; total fee shown'
  expect: pass
  known: Testnet4 estimates are ~1-2 sat/vB, so Normal vs High ordering (#305) is not testable here
---
- runFlow:
    file: ../subflows/open_collection.yaml
    env: { COLLECTION: "My Wallet" }
- tapOn: { id: "bottom_nav_send" }
- extendedWaitUntil: { visible: { id: "composeBtn" }, timeout: 30000 }
- extendedWaitUntil:
    visible: { id: "totalBTC", text: "[0-9.]+ BTC" }
    timeout: 60000
- runScript: { file: ../scripts/js/clip_set.js, env: { TEXT: "${TB1_ADDR}" }, label: "clipboard = throwaway tb1 address" }
- tapOn: { id: "text_input_end_icon", index: 0, label: "Paste icon in the To field" }
- assertVisible: { id: "btcAddress", text: "${TB1_ADDR}" }
- tapOn: { id: "btcEditText" }
- eraseText: 20
- inputText: "0.001"
- assertVisible: { id: "selectedFeeRateLayman", text: "Low" }
- assertVisible: { id: "selectedFeeRate", text: "[0-9.]+ sat/vB" }
- copyTextFrom: { id: "totalMinerFee" }
- evalScript: { script: "${output.f1 = maestro.copiedText}", label: "fee at Low" }
- swipe: { start: "10%, 43%", end: "75%, 43%", duration: 1500 }
- waitForAnimationToEnd: { timeout: 3000 }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: SEND-10-max, optional: true } } ] }
- assertNotVisible: { id: "selectedFeeRateLayman", text: "Low", label: "Label moved off Low" }
- assertVisible: { id: "totalMinerFee", text: "[0-9.]+ BTC" }
- back
