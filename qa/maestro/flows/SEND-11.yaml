# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: SEND-11
tags:
- p1
- send
- fee
properties:
  plan: 'SEND-11: Fee slider: min = 1 sat/vB, max raises the rate and fee; compose still works'
  expect: pass
  known: Max is 1.5x the Dojo High estimate (about 2 sat/vB on testnet4); no custom fee (#77). PSBT rate not decoded here
---
- runFlow:
    file: ../subflows/open_collection.yaml
    env: { COLLECTION: "My Wallet" }
- tapOn: { id: "bottom_nav_send" }
- extendedWaitUntil: { visible: { id: "composeBtn" }, timeout: 30000 }
- extendedWaitUntil:
    visible: { id: "totalBTC", text: "[0-9.]+ BTC" }
    timeout: 60000
- runScript: { file: ../scripts/js/clip_set.js, env: { TEXT: "${TB1_ADDR}" }, label: "clipboard = throwaway tb1 address" }
- tapOn: { id: "text_input_end_icon", index: 0, label: "Paste icon in the To field" }
- assertVisible: { id: "btcAddress", text: "${TB1_ADDR}" }
- tapOn: { id: "btcEditText" }
- eraseText: 20
- inputText: "0.001"
- assertVisible: { id: "selectedFeeRate", text: "1 sat/vB" }
- copyTextFrom: { id: "totalMinerFee" }
- evalScript: { script: "${output.f1 = parseFloat(maestro.copiedText.replace(/[^0-9.]/g,''))}", label: "fee at min" }
- swipe: { start: "10%, 43%", end: "75%, 43%", duration: 1500 }
- waitForAnimationToEnd: { timeout: 3000 }
- copyTextFrom: { id: "totalMinerFee" }
- evalScript: { script: "${output.f2 = parseFloat(maestro.copiedText.replace(/[^0-9.]/g,''))}", label: "fee at max" }
- copyTextFrom: { id: "selectedFeeRate" }
- evalScript: { script: "${output.r2 = parseFloat(maestro.copiedText)}", label: "rate at max" }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: SEND-11-max, optional: true } } ] }
- assertTrue: { condition: "${output.r2 > 1 && output.f2 > output.f1}", label: "Max rate > 1 sat/vB and fee rose" }
- extendedWaitUntil:
    visible: { id: "composeBtn", enabled: true }
    timeout: 60000
    label: "COMPOSE becomes enabled (fee estimate can take a while on the emulator)"
- tapOn: { id: "composeBtn" }
- extendedWaitUntil:
    visible: { id: "psbtQRCode|psbtCopyBtn|unsignedTxView" }
    timeout: 60000
- assertVisible: { id: "broadCastTransactionBtn", label: "Unsigned Transaction screen (BROADCAST is never tapped)" }
- back
- back
