# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: SET-05
tags:
- p0
- settings
- backup
- clipboard
properties:
  plan: 'SET-05: Wrong backup password: "Incorrect password", nothing imported (dummy empty blob)'
  expect: pass
---
- runFlow: ../subflows/open_settings.yaml
- scrollUntilVisible:
    element: { text: "Import Sentinel Backup" }
    direction: DOWN
    timeout: 30000
- tapOn: "Import Sentinel Backup"
- extendedWaitUntil: { visible: { id: "importPastePayloadBtn" }, timeout: 20000 }
- runScript: { file: ../scripts/js/clip_set.js, env: { TEXT: "${DUMMY_BACKUP}" }, label: "clipboard = dummy backup (empty payload)" }
- tapOn: { id: "importPastePayloadBtn" }
- extendedWaitUntil: { visible: { id: "importPasswordInput" }, timeout: 15000 }
- tapOn: { id: "importPasswordInput" }
- inputText: "definitely-the-wrong-password"
- tapOn: { id: "importStartBtn" }
- extendedWaitUntil:
    visible: { text: "Incorrect password, please try again\\." }
    timeout: 60000
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: SET-05-wrong-password, optional: true } } ] }
- assertNotVisible: { text: "Imported.*" }
- runScript: { file: ../scripts/js/clip_set.js, env: { TEXT: " " }, label: "clear clipboard" }
- back
- runFlow: ../subflows/home_basic.yaml
- assertVisible: { id: "rvItemCollectionTitle", text: "My Wallet" }
