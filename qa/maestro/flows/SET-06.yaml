# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: SET-06
tags:
- p1
- settings
- backup
- clipboard
properties:
  plan: 'SET-06: Corrupt (truncated) backup: clear error, nothing changed'
  expect: pass
---
- runFlow: ../subflows/open_settings.yaml
- scrollUntilVisible:
    element: { text: "Import Sentinel Backup" }
    direction: DOWN
    timeout: 30000
- tapOn: "Import Sentinel Backup"
- extendedWaitUntil: { visible: { id: "importPastePayloadBtn" }, timeout: 20000 }
- runScript: { file: ../scripts/js/clip_set.js, env: { TEXT: "${DUMMY_BACKUP_TRUNC}" }, label: "clipboard = truncated dummy backup" }
- tapOn: { id: "importPastePayloadBtn" }
- waitForAnimationToEnd: { timeout: 5000 }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: SET-06-truncated, optional: true } } ] }
- runFlow:
    when: { visible: { id: "importPasswordInput" } }
    commands:
      - tapOn: { id: "importPasswordInput" }
      - inputText: "x-wrong"
      - tapOn: { id: "importStartBtn" }
      - waitForAnimationToEnd: { timeout: 10000 }
- assertNotVisible: { text: "Imported.*" }
- assertNotVisible: { id: "importCollections", label: "Import options never offered" }
- runScript: { file: ../scripts/js/clip_set.js, env: { TEXT: " " }, label: "clear clipboard" }
- back
- runFlow: ../subflows/home_basic.yaml
- assertVisible: { id: "rvItemCollectionTitle", text: "My Wallet" }
