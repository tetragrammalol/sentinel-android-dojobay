appId: ${APP_ID}
name: SET-12
tags:
- p2
- settings
properties:
  plan: 'SET-12: Explorer selection list opens with choices; cancel keeps the current one'
  expect: pass
---
- runFlow: ../subflows/open_settings.yaml
- copyTextFrom: { text: ".+", below: { text: "Explorer" } }
- evalScript: { script: "${output.ex = maestro.copiedText}", label: "current explorer" }
- tapOn: "Explorer"
- waitForAnimationToEnd: { timeout: 3000 }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: SET-12-list, optional: true } } ] }
- assertVisible: { text: "${output.ex}" }
- tapOn: { text: "(?i)cancel" }
- assertVisible: { text: "${output.ex}", below: { text: "Explorer" } }
- back
