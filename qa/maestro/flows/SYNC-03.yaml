# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: SYNC-03
tags:
- smoke
- p1
- home
- sync
properties:
  plan: 'SYNC-03: Pull to refresh triggers a sync with visible feedback, ending in success'
  expect: pass
---
- runFlow: ../subflows/home.yaml
- runFlow: ../subflows/wait_sync_idle.yaml
- swipe:
    start: "50%, 35%"
    end: "50%, 85%"
    duration: 800
- extendedWaitUntil:
    visible:
      id: "syncStatusText"
      text: "(Syncing.*|Updated just now|Connecting via Tor.*)"
    timeout: 30000
    label: "Sync banner appears after the pull"
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: SYNC-03-syncing, optional: true } } ] }
- extendedWaitUntil:
    notVisible:
      id: "syncStatusText"
      text: "(Syncing.*|Connecting via Tor.*)"
    timeout: 240000
- assertNotVisible:
    id: "syncRetryButton"
    label: "No failed-sync RETRY banner"
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: SYNC-03-done, optional: true } } ] }