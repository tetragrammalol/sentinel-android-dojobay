# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: SYNC-09
tags:
- smoke
- p0
- collection
properties:
  plan: 'SYNC-09: Key tabs filter the header and list (My Wallet: All, Deposit, Premix, Postmix, Badbank)'
  expect: pass
---
- runFlow:
    file: ../subflows/open_collection.yaml
    env: { COLLECTION: "My Wallet" }
- tapOn: { id: "bottom_nav_transaction" }
- copyTextFrom: { id: "collectionBalanceBtc" }
- evalScript: { script: "${output.all = maestro.copiedText}", label: "All balance" }
- tapOn: "Deposit"
- waitForAnimationToEnd: { timeout: 3000 }
- assertVisible: { id: "collectionBalanceBtc", text: "[0-9.]+ BTC" }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: SYNC-09-deposit, optional: true } } ] }
- tapOn: "Premix"
- waitForAnimationToEnd: { timeout: 3000 }
- assertVisible: { id: "collectionBalanceBtc", text: "0\\.00000000 BTC" }
- assertNotVisible:
    id: "bottom_nav_send"
    label: "Receive/Send hidden on Premix"
- tapOn: "Postmix"
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: "Badbank"
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: "All"
- waitForAnimationToEnd: { timeout: 3000 }
- assertVisible: { id: "collectionBalanceBtc", text: "${output.all}" }
- back
