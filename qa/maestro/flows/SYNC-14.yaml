# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: SYNC-14
tags:
- p1
- settings
- fiat
properties:
  plan: 'SYNC-14: Currency EUR shows EUR on Home; switched back to USD'
  expect: pass
---
- runFlow: ../subflows/open_settings.yaml
- tapOn: "Currency"
- waitForAnimationToEnd: { timeout: 3000 }
- scrollUntilVisible: { element: { text: "EUR" }, direction: DOWN, timeout: 20000 }
- tapOn: "EUR"
- assertVisible: { text: "EUR", below: { text: "Currency" } }
- runFlow: ../subflows/home_basic.yaml
- extendedWaitUntil:
    visible: { id: "exchangeRateTxt", text: ".*EUR" }
    timeout: 120000
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: SYNC-14-eur, optional: true } } ] }
- runFlow: ../subflows/open_settings.yaml
- tapOn: "Currency"
- waitForAnimationToEnd: { timeout: 3000 }
- scrollUntilVisible: { element: { text: "USD" }, direction: DOWN, timeout: 20000 }
- tapOn: "USD"
- assertVisible: { text: "USD", below: { text: "Currency" } }
- runFlow: ../subflows/home_basic.yaml
