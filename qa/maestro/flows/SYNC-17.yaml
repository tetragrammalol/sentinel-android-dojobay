# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: SYNC-17
tags:
- p2
- settings
- fiat
properties:
  plan: 'SYNC-17: Hide fiat removes fiat on Home; turned back off'
  expect: pass
---
- runFlow: ../subflows/open_settings.yaml
- scrollUntilVisible:
    element: { text: "Hide fiat values" }
    direction: DOWN
    timeout: 30000
- assertVisible:
    containsChild: { id: "android:id/widget_frame", containsChild: { id: "android:id/checkbox", checked: false } }
    containsDescendants: [ { text: "Hide fiat values" } ]
    label: "Hide fiat values is off"
- tapOn: "Hide fiat values"
- runFlow: ../subflows/home_basic.yaml
- waitForAnimationToEnd: { timeout: 3000 }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: SYNC-17-hidden, optional: true } } ] }
- assertNotVisible: { id: "exchangeRateTxt", text: ".*[0-9].*", label: "No fiat on Home" }
- runFlow: ../subflows/open_settings.yaml
- scrollUntilVisible:
    element: { text: "Hide fiat values" }
    direction: DOWN
    timeout: 30000
- tapOn: "Hide fiat values"
- assertVisible:
    containsChild: { id: "android:id/widget_frame", containsChild: { id: "android:id/checkbox", checked: false } }
    containsDescendants: [ { text: "Hide fiat values" } ]
    label: "Hide fiat values is off"
- runFlow: ../subflows/home_basic.yaml
