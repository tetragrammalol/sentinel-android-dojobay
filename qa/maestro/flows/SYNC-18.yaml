# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: SYNC-18
tags:
- p1
- settings
- privacy
properties:
  plan: 'SYNC-18: Street mode masks the balances on Home and in a collection; turned back off'
  expect: pass
---
- runFlow: ../subflows/open_settings.yaml
- scrollUntilVisible:
    element: { text: "Street mode" }
    direction: DOWN
    timeout: 30000
- assertVisible:
    containsChild: { id: "android:id/widget_frame", containsChild: { id: "android:id/checkbox", checked: false } }
    containsDescendants: [ { text: "Street mode" } ]
    label: "Street mode is off"
- tapOn: "Street mode"
- runFlow: ../subflows/home_basic.yaml
- waitForAnimationToEnd: { timeout: 3000 }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: SYNC-18-home, optional: true } } ] }
- assertNotVisible: { id: "rvItemCollectionBalance", text: "[0-9].*", label: "Rows masked" }
- assertNotVisible: { id: "homeBalanceBtc", text: "[0-9].*", label: "Total masked" }
- tapOn: { id: "rvItemCollectionTitle", text: "My Wallet" }
- extendedWaitUntil: { visible: { id: "collectionBalanceBtc" }, timeout: 30000 }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: SYNC-18-collection, optional: true } } ] }
- assertNotVisible: { id: "collectionBalanceBtc", text: "[0-9].*", label: "Collection header masked" }
- runFlow: ../subflows/open_settings.yaml
- scrollUntilVisible:
    element: { text: "Street mode" }
    direction: DOWN
    timeout: 30000
- tapOn: "Street mode"
- assertVisible:
    containsChild: { id: "android:id/widget_frame", containsChild: { id: "android:id/checkbox", checked: false } }
    containsDescendants: [ { text: "Street mode" } ]
    label: "Street mode is off"
- runFlow: ../subflows/home_basic.yaml
