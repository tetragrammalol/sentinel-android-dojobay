appId: ${APP_ID}
name: UTXO-01
tags:
- p1
- utxo
properties:
  plan: 'UTXO-01: Unspent outputs: Active list with amounts and addresses (Deposit)'
  expect: pass
  known: The sum-vs-balance check stays manual (indices of scrolled rows are not stable in Maestro)
---
- runFlow:
    file: ../subflows/open_collection.yaml
    env: { COLLECTION: "My Wallet" }
- tapOn: "More options"
- tapOn: "View Unspent Outputs"
- extendedWaitUntil: { visible: { id: "utxo_item" }, timeout: 30000 }
- assertVisible: "Active"
- assertVisible: { id: "utxo_item_amount", index: 0, text: "[0-9.]+ BTC" }
- assertVisible: { id: "utxo_item_address", index: 0, text: "tb1.*" }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: UTXO-01-list, optional: true } } ] }
- back
- back
