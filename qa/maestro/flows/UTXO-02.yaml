# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: UTXO-02
tags:
- p0
- utxo
properties:
  plan: 'UTXO-02: Mark do-not-spend moves the UTXO to Blocked (restored afterwards)'
  expect: pass
---
- runFlow:
    file: ../subflows/open_collection.yaml
    env: { COLLECTION: "My Wallet" }
- tapOn: "More options"
- tapOn: "View Unspent Outputs"
- extendedWaitUntil: { visible: { id: "utxo_item" }, timeout: 30000 }
- copyTextFrom: { id: "utxo_item_amount", index: 0 }
- evalScript: { script: "${output.amt = maestro.copiedText}", label: "amount" }
- longPressOn: { id: "utxo_item", index: 0 }
- tapOn: "More options"
- tapOn: "Mark as do not spend"
- extendedWaitUntil: { visible: { text: "Blocked" }, timeout: 20000 }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: UTXO-02-blocked, optional: true } } ] }
- scrollUntilVisible: { element: { text: "Blocked" }, direction: DOWN, timeout: 20000 }
- assertVisible: { id: "utxo_item_amount", text: "${output.amt}", below: { text: "Blocked" } }
- repeat:
    while: { visible: { text: "Blocked" } }
    times: 5
    commands:
      - scrollUntilVisible: { element: { text: "Blocked" }, direction: DOWN, timeout: 20000 }
      - longPressOn: { id: "utxo_item", below: { text: "Blocked" } }
      - tapOn: "More options"
      - tapOn: "Mark as Spendable"
      - waitForAnimationToEnd: { timeout: 5000 }
- assertNotVisible: "Blocked"
- back
- back
