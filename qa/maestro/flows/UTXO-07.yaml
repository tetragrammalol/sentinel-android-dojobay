# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: UTXO-07
tags:
- p2
- utxo
properties:
  plan: 'UTXO-07: UTXO filter sheet opens, Apply keeps the list (reset = no filter)'
  expect: pass
---
- runFlow:
    file: ../subflows/open_collection.yaml
    env: { COLLECTION: "My Wallet" }
- tapOn: "More options"
- tapOn: "View Unspent Outputs"
- extendedWaitUntil: { visible: { id: "utxo_item" }, timeout: 30000 }
- tapOn: { id: "action_utxo_filter" }
- extendedWaitUntil: { visible: { id: "utxo_filter_apply_btn" }, timeout: 10000 }
- assertVisible: { id: "spendable_checkBox_btn" }
- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: UTXO-07-filter, optional: true } } ] }
- tapOn: { id: "dsc_amount_radio_btn" }
- tapOn: { id: "utxo_filter_apply_btn" }
- waitForAnimationToEnd: { timeout: 3000 }
- assertVisible: { id: "utxo_item", index: 0 }
- tapOn: { id: "action_utxo_filter" }
- tapOn: { id: "asc_amount_radio_btn" }
- tapOn: { id: "utxo_filter_apply_btn" }
- back
- back
