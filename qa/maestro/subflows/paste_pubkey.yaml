# Home -> NEW -> Paste the given text from the clipboard into the add-key scanner sheet.
# Param: KEY (public throwaway data only)
appId: ${APP_ID}
---
- runFlow: home.yaml
- runScript:
    file: ../scripts/js/clip_set.js
    env:
      TEXT: ${KEY}
    label: "Set device clipboard (public throwaway data)"
- tapOn:
    id: "fab"
- runFlow:
    when:
      visible:
        text: "Requesting camera permission"
    commands:
      - tapOn:
          text: "(?i)yes"
      - runFlow:
          when:
            visible:
              id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button|com.android.permissioncontroller:id/permission_allow_button"
          commands:
            - tapOn:
                id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button|com.android.permissioncontroller:id/permission_allow_button"
- extendedWaitUntil:
    visible:
      id: "pastePubKey"
    timeout: 30000
- tapOn:
    id: "pastePubKey"
